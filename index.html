<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fascicolo 1 – La morte di Sebastian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --notte: #0f1113;
    --cartella: #c9b48a;
    --cartella-scura: #b39c70;
    --foglio: #ece3cf;
    --inchiostro: #1d1a16;
    --nastro: #f2c200;
    --sangue: #b3151c;
    --grigio: #8b8f94;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% -10%, #2a2f34 0%, transparent 60%), var(--notte);
    color: var(--foglio);
    font-family: "Special Elite", "Courier New", Courier, monospace;
    line-height: 1.55;
    padding-bottom: 3rem;
  }

  .nastro {
    background: repeating-linear-gradient(-45deg, var(--nastro) 0 22px, #111 22px 44px);
    color: #111; font-family: "Oswald", Impact, "Arial Narrow", sans-serif;
    font-weight: 700; letter-spacing: .12em; text-align: center; padding: .55rem 0;
    overflow: hidden; white-space: nowrap; border-block: 2px solid #111;
  }
  .nastro span { display: inline-block; background: var(--nastro); padding: .1rem .8rem; }
  .nastro.storto { transform: rotate(-1.4deg); margin: 0 -2rem; box-shadow: 0 6px 18px rgba(0,0,0,.6); }

  header.testata { padding: 2.5rem 1.25rem 1rem; max-width: 40rem; margin: 0 auto; }
  h1 {
    font-family: "Oswald", Impact, "Arial Narrow", sans-serif; font-weight: 700;
    font-size: clamp(2.2rem, 9vw, 3.6rem); line-height: .95; margin: 0 0 1rem;
    text-transform: uppercase; letter-spacing: .02em;
  }
  h1 .sub { display: block; color: var(--sangue); font-size: .5em; letter-spacing: .3em; margin-top: .4rem; }

  main { max-width: 40rem; margin: 1.5rem auto 0; padding: 0 1.25rem; }

  .fascicolo { position: relative; padding-top: 1.6rem; }
  .linguetta {
    position: absolute; top: 0; left: 1.2rem; background: var(--cartella); color: var(--inchiostro);
    font-family: "Oswald", sans-serif; font-weight: 500; letter-spacing: .1em;
    padding: .25rem 1rem; border-radius: 6px 6px 0 0; font-size: .85rem;
  }
  .cartella { background: var(--cartella); color: var(--inchiostro); padding: 1.5rem 1.25rem 1.25rem; box-shadow: 0 10px 24px rgba(0,0,0,.55); position: relative; }
  .foglio { background: var(--foglio); padding: 1.1rem 1.1rem 1rem; box-shadow: 0 2px 0 var(--cartella-scura), 0 4px 6px rgba(0,0,0,.25); position: relative; }
  .segnalino {
    position: absolute; top: -1.05rem; right: 1rem; width: 2.3rem; height: 2.7rem; background: var(--nastro);
    clip-path: polygon(50% 0, 100% 100%, 0 100%); display: grid; place-items: end center;
    font-family: "Oswald", sans-serif; font-weight: 700; font-size: 1.05rem; padding-bottom: .15rem; color: #111;
  }
  .foglio h2 { font-family: "Oswald", Impact, sans-serif; text-transform: uppercase; letter-spacing: .04em; font-size: 1.5rem; line-height: 1.1; margin: 0 2.8rem .2rem 0; }
  .foglio .domanda { margin: 0 0 1rem; font-size: .9rem; color: #5a5347; }

  .opzioni { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
  .opzioni button {
    width: 100%; text-align: left; font: inherit; color: var(--inchiostro); background: transparent;
    border: 1.5px dashed #6b6252; padding: .55rem .8rem; cursor: pointer; display: flex; gap: .8rem; align-items: baseline;
  }
  .opzioni button:hover:not(:disabled) { background: rgba(0,0,0,.07); border-style: solid; }
  .opzioni button:focus-visible { outline: 3px solid #000; outline-offset: 2px; }
  .lettera { font-family: "Oswald", sans-serif; font-weight: 700; min-width: 1.4rem; }
  .opzioni button.sbagliata { color: #8a8478; border-color: #b8b09e; text-decoration: line-through; text-decoration-color: var(--sangue); text-decoration-thickness: 2px; }
  .opzioni button.giusta { background: var(--inchiostro); color: var(--foglio); border: 1.5px solid var(--inchiostro); }
  .opzioni button:disabled { cursor: default; }

  .esito { margin: .9rem 0 0; min-height: 1.4rem; font-size: .92rem; }
  .esito.no { color: var(--sangue); }
  .esito.ok { color: var(--inchiostro); }

  .timbro {
    position: absolute; right: 1rem; bottom: 1.6rem; border: 4px solid var(--sangue); color: var(--sangue);
    font-family: "Oswald", Impact, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .12em;
    font-size: 1.5rem; padding: .1rem .7rem; transform: rotate(-9deg) scale(1); opacity: 0; pointer-events: none;
    mix-blend-mode: multiply; border-radius: 4px;
  }
  .fascicolo.risolto .timbro { opacity: .88; animation: timbra .28s cubic-bezier(.2,1.6,.4,1); }
  @keyframes timbra { from { transform: rotate(-9deg) scale(2.2); opacity: 0; } to { transform: rotate(-9deg) scale(1); opacity: .88; } }

  @media (max-width: 26rem) { .timbro { font-size: 1.1rem; bottom: 1rem; } .foglio h2 { font-size: 1.25rem; } }
</style>
</head>
<body>

<div class="nastro storto" aria-hidden="true"><span>NON OLTREPASSARE · SCENA DEL CRIMINE · NON OLTREPASSARE</span></div>

<header class="testata">
  <h1>Casi express<span class="sub">Fascicolo 1</span></h1>
</header>

<main>
  <section class="fascicolo" id="fascicolo">
    <div class="linguetta">Fascicolo 1</div>
    <div class="cartella">
      <div class="foglio">
        <div class="segnalino" aria-hidden="true">1</div>
        <h2>La morte di Sebastian</h2>
        <p class="domanda">Chi ha ucciso Sebastian?</p>
        <ul class="opzioni" id="opzioni"></ul>
        <p class="esito" id="esito" aria-live="polite"></p>
      </div>
      <div class="timbro" id="timbro" aria-hidden="true">Caso chiuso</div>
    </div>
  </section>
</main>

<div class="nastro" aria-hidden="true" style="margin-top:2.5rem"><span>SCENA DEL CRIMINE · NON OLTREPASSARE</span></div>

<script>
const opzioni = ["Marcus", "Tiago", "Joel", "Nessuno di loro"];
const giusta = 1;
const spiegazione = "Ossigeno (O), argento (Ag) e titanio (Ti) in ordine formano Ti-Ag-O: Tiago.";
const lettere = ["A", "B", "C", "D"];

const lista = document.getElementById("opzioni");
const esito = document.getElementById("esito");
const fascicolo = document.getElementById("fascicolo");

let risolto = false;
const bottoni = opzioni.map((testo, i) => {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.type = "button";
  b.innerHTML = '<span class="lettera">' + lettere[i] + '</span><span></span>';
  b.lastChild.textContent = testo;
  b.addEventListener("click", () => {
    if (risolto) return;
    if (i === giusta) {
      risolto = true;
      b.classList.add("giusta");
      bottoni.forEach((x) => (x.disabled = true));
      esito.className = "esito ok";
      esito.textContent = "Esatto. " + spiegazione;
      fascicolo.classList.add("risolto");
    } else {
      b.classList.add("sbagliata");
      b.disabled = true;
      esito.className = "esito no";
      esito.textContent = "Alibi confermato. Non è lui: riprova, detective.";
    }
  });
  li.appendChild(b);
  lista.appendChild(li);
  return b;
});
</script>
</body>
</html>
